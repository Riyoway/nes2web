[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nes2web"
version = "0.2.0"
description = "Local-first NES ROM to web-port and reverse-engineering workspace generator"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "NES2Web contributors"}]
keywords = ["nes", "6502", "web", "reverse-engineering", "emulation"]

[project.scripts]
nes2web = "nes2web.cli:main"

[tool.setuptools]
packages = ["nes2web"]
